<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Resume</title>
    <script>
        (function () {
            var savedTheme = localStorage.getItem('theme') || 'dark';
            var root = document.documentElement;
            root.setAttribute('data-theme', savedTheme);
            root.style.colorScheme = savedTheme === 'dark' ? 'dark' : 'light';
        })();
    </script>
    <link rel="stylesheet" href="/styles.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100vh;
            border: none;
        }
    </style>
</head>

<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <main id="main-content" tabindex="-1" aria-label="Resume" style="height: 100%; width: 100%; margin: 0;">
        <iframe src="/resume.pdf" title="Resume PDF" style="width: 100%; height: 100vh; border: none;">
            <p>Your browser does not support PDFs. <a href="/resume.pdf">Download the PDF</a>
                instead.</p>
        </iframe>
    </main>
    <script src="/theme-ui.js"></script>
</body>

</html>
